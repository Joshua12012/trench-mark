[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trench-mark"
version = "1.0.3"
description = "Automated, memory-safe TensorRT performance profiling and ONNX export for Jetson edge devices."
readme = "README.md"
requires-python = ">=3.8"
keywords = ["tensorrt", "nvidia", "jetson", "yolo", "benchmark", "edge-computing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console"
]
dependencies = [
    "pyyaml",
    "ultralytics"
]

[project.scripts]
trench-mark = "trench_mark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]